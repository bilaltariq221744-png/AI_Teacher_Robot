# =============================================================================
# AI Teacher Robot — Project Configuration (pyproject.toml)
# =============================================================================
# This file configures the Python build system, code formatters, linters,
# and type checkers used in the AI Teacher Robot project.
# =============================================================================

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

# -----------------------------------------------------------------------------
# Project Metadata (mirrors setup.py)
# -----------------------------------------------------------------------------
[project]
name = "ai-teacher-robot"
version = "0.1.0"
description = "An AI-powered educational robot for Grade 2-10 students, running locally on a Raspberry Pi."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Bilal Tariq", email = "bilaltariq221744-png@users.noreply.github.com" }
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Education",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "PyYAML>=6.0,<7.0",
    "loguru>=0.7,<0.8",
    "python-dotenv>=1.0,<2.0",
    "requests>=2.31,<3.0",
    "python-dateutil>=2.8,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<8.0",
    "pytest-cov>=4.1,<5.0",
    "pytest-mock>=3.11,<4.0",
    "ruff>=0.1.0,<0.2.0",
    "black>=23.0,<24.0",
    "isort>=5.12,<6.0",
    "mypy>=1.5,<2.0",
    "Sphinx>=7.0,<8.0",
    "sphinx-rtd-theme>=1.3,<2.0",
    "pre-commit>=3.3,<4.0",
]

[project.scripts]
ai-teacher-robot = "src.main:main"

[project.urls]
Homepage = "https://github.com/bilaltariq221744-png/AI_Teacher_Robot"
Repository = "https://github.com/bilaltariq221744-png/AI_Teacher_Robot"
Issues = "https://github.com/bilaltariq221744-png/AI_Teacher_Robot/issues"

# -----------------------------------------------------------------------------
# Tool Configurations
# -----------------------------------------------------------------------------

# --- Black (Code Formatter) ---
[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.venv
    | build
    | dist
    | __pycache__
)/
'''

# --- isort (Import Sorter) ---
[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["src"]

# --- Ruff (Linter) ---
[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]
exclude = [
    ".venv",
    "build",
    "dist",
    "__pycache__",
    ".git",
    ".mypy_cache",
    ".ruff_cache",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "D",   # pydocstyle
]
ignore = [
    "D203",  # 1 blank line required before class docstring (conflicts with D211)
    "D213",  # Multi-line docstring summary should start at the second line
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "S101"]  # Ignore docstring & assert rules in tests

# --- Mypy (Type Checker) ---
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
namespace_packages = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# --- Pytest ---
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "hardware: marks tests that require physical hardware",
]

# --- Coverage ---
[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
